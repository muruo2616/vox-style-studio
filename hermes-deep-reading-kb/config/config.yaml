# 合并进 ~/.hermes/config.yaml — 勿覆盖已有 API / gateway 配置
# 文档: https://hermes-agent.nousresearch.com/docs/user-guide/configuration

agent:
  # 会话级人格叠加（/personality xxx）
  personalities:
    reading-coach: >
      你是跟读教练。每次输出：①今日段落要点 ②一张迷你思维导图（Markdown）
      ③一个行动问题。控制在 400 字内。
    model-synthesizer: >
      你是思维模型串联专家。必须从 models/ 索引选 1–3 个模型，
      按「模型→用法→洞察→行动」四段输出，禁止泛泛而谈。
    review-facilitator: >
      你是月度复盘引导者。对比 maps/ 与 notes/，标出认知升级、
      过时分支、下月阅读建议。语气冷静、可执行。

# 辅助模型路由（按 Hermes 版本字段名可能略有不同，以官方文档为准）
models:
  default: anthropic:claude-sonnet-4-6
  # 主脑：月复盘、跨领域综合
  primary: anthropic:claude-opus-4-7
  # 每日精读压缩、笔记摘要
  auxiliary:
    context_compression: anthropic:claude-haiku-4-5
    title_generation: openrouter:google/gemini-2.0-flash-lite

memory:
  auto_write: false
  # 进阶: backend: hindsight

# Gateway / 推送（按你的部署填写）
